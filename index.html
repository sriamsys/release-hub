<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Defensive fix for environments where window.fetch is read-only.
      // This prevents polyfills like formdata-polyfill from attempting to reassign it.
      if (typeof FormData !== 'undefined' && !FormData.prototype.keys) {
        FormData.prototype.keys = function* () {};
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

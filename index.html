<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Defensive fix for environments where window.fetch is a read-only getter.
        // This prevents libraries like formdata-polyfill from crashing when attempting to patch it.
        const originalFetch = window.fetch;
        if (typeof originalFetch === 'function') {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function() { console.warn('[ReleaseHub] Suppressed attempt to overwrite read-only window.fetch'); },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            // If even defineProperty fails (e.g. non-configurable), we just have to hope for the best
          }
        }

        // Prevent formdata-polyfill from attempting the patch by satisfying its feature check
        if (typeof FormData !== 'undefined' && !FormData.prototype.keys) {
          FormData.prototype.keys = function* () {};
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
